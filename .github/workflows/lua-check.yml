name: Lua syntax, proxy and triangle collision tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: Validate Lua scripts, proxy and triangle collision adapter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Check all Lua files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.4 -p "$file"
          done < <(find . -type f -name '*.lua' -print0)

      - name: Run proxy behavior tests
        run: lua5.4 tools/test_proxy.lua

      - name: Run triangle collision math tests
        run: lua5.4 tools/test_tri_collider.lua

      - name: Run SM64 collision adapter tests
        run: lua5.4 tools/test_sm64_collision_adapter.lua
