name: Lua syntax, Minecraft parity, proxy and collision tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: Validate Lua scripts, Minecraft ports, proxy and collision adapter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Check all Lua files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.4 -p "$file"
          done < <(find . -type f -name '*.lua' -print0)

      - name: Test detached Steve GeoLayout alpha sanitization
        run: python3 tools/test_steve_geo_sanitizer.py

      - name: Run proxy behavior tests
        run: lua5.4 tools/test_proxy.lua

      - name: Run triangle collision math tests
        run: lua5.4 tools/test_tri_collider.lua

      - name: Run SM64 collision adapter tests
        run: lua5.4 tools/test_sm64_collision_adapter.lua

      - name: Run Minecraft 26.3 physics parity tests
        run: lua5.4 tools/test_minecraft_26_3_physics.lua

      - name: Run independent Steve physics resolver tests
        run: lua5.4 tools/test_independent_physics.lua

      - name: Run Minecraft 26.3 camera parity tests
        run: lua5.4 tools/test_minecraft_26_3_camera.lua

      - name: Validate Minecraft physics/camera port manifest
        run: python3 -m unittest discover -s tools -p "minecraft_26_3_port_test.py" -v
