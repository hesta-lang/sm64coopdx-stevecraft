name: Build Steve DynOS character

on:
  push:
    paths:
      - "tools/build_steve_actor.py"
      - "tools/import_bedrock_geometry.py"
      - "tools/steve_geo_sanitizer.py"
      - "tools/test_steve_geo_sanitizer.py"
      - "tools/steve_geo_skeleton.py"
      - "tools/test_steve_geo_skeleton.py"
      - "tools/build_steve_hand.py"
      - "tools/build_steve_skin_textures.py"
      - ".github/workflows/build-steve-actor.yml"
      - "assets/steve/**"
  workflow_dispatch:
    inputs:
      model_source:
        description: "Geometry source for Steve's model"
        type: choice
        options:
          - java
          - bedrock
        default: java
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test detached Steve GeoLayout alpha sanitization
        run: python tools/test_steve_geo_sanitizer.py

      - name: Test Minecraft DynOS skeleton channel alignment
        run: python tools/test_steve_geo_skeleton.py

      - name: Download Blender 3.6 LTS
        run: |
          set -euo pipefail
          urls=(
            "https://mirror.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz"
            "https://mirror.freedif.org/blender/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz"
            "https://mirror.nju.edu.cn/blender/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz"
          )
          downloaded=0
          for url in "${urls[@]}"; do
            echo "Trying $url"
            rm -f blender.tar.xz
            if curl -fL --retry 2 --connect-timeout 20 "$url" -o blender.tar.xz && tar -tJf blender.tar.xz >/dev/null 2>&1; then
              downloaded=1
              break
            fi
          done
          test "$downloaded" -eq 1
          tar -xf blender.tar.xz
          echo "$PWD/blender-3.6.23-linux-x64" >> "$GITHUB_PATH"

      - name: Download official character template and Fast64-Gart
        run: |
          mkdir -p build/fast64 build/actor/actors
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/coop-deluxe/character-template/main/Mario%20Coop%20Model%20Template.blend" \
            -o build/mario-template.blend
          curl -fL --retry 3 \
            https://codeload.github.com/ManIsCat2/Fast64-Gart/zip/refs/heads/main \
            -o fast64.zip
          unzip -q fast64.zip -d build/fast64
          mv build/fast64/Fast64-Gart-main build/fast64/fast64_gart
          test -s build/mario-template.blend
          test -f build/fast64/fast64_gart/__init__.py

      - name: Set up Python and crop Minecraft PlayerModel skin UVs
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and import Bedrock Steve geometry
        if: ${{ inputs.model_source == 'bedrock' }}
        env:
          BEDROCK_SAMPLES_REVISION: 15701fa9c13923f12662984c32c124327e40e3d3
        run: |
          set -euo pipefail
          mkdir -p build/bedrock-source build/bedrock-import
          curl -fL --retry 3 \\
            "https://raw.githubusercontent.com/Mojang/bedrock-samples/${BEDROCK_SAMPLES_REVISION}/resource_pack/models/entity/humanoid.custom.geo.json" \\
            -o build/bedrock-source/humanoid.custom.geo.json
          curl -fL --retry 3 \\
            "https://raw.githubusercontent.com/Mojang/bedrock-samples/${BEDROCK_SAMPLES_REVISION}/resource_pack/entity/player.entity.json" \\
            -o build/bedrock-source/player.entity.json
          python tools/import_bedrock_geometry.py \\
            --input build/bedrock-source/humanoid.custom.geo.json \\
            --entity-config build/bedrock-source/player.entity.json \\
            --source-revision "${BEDROCK_SAMPLES_REVISION}" \\
            --output build/bedrock-import/steve_geometry.json
          test -s build/bedrock-import/steve_geometry.json

      - name: Generate per-cuboid Minecraft skin textures
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python tools/build_steve_skin_textures.py \
            --skin assets/steve/steve_skin.png \
            --output build/steve-skin-textures
          test -s build/steve-skin-textures/manifest.json
          test -s build/steve-skin-textures/head_base.png
          test -s build/steve-skin-textures/head_hat.png
          test -s build/steve-skin-textures/torso_jacket.png
          test -s build/steve-skin-textures/left_arm_sleeve.png

      - name: Build and export Steve actor
        env:
          FAST64_ADDON: ${{ github.workspace }}/build/fast64
          STEVE_ACTOR_OUTPUT: ${{ github.workspace }}/build/actor/actors
          STEVE_SKIN_TEXTURE_ROOT: ${{ github.workspace }}/build/steve-skin-textures
          STEVE_BUILD_REPORT: ${{ github.workspace }}/build/steve-build-report.json
          STEVE_MODEL_SOURCE: ${{ inputs.model_source || 'java' }}
        run: |
          set -euo pipefail
          if [[ "$STEVE_MODEL_SOURCE" == "bedrock" ]]; then
            export STEVE_BEDROCK_GEOMETRY_SPEC="$PWD/build/bedrock-import/steve_geometry.json"
          fi
          blender -b build/mario-template.blend --python tools/build_steve_actor.py
          test -s build/steve-build-report.json
          test -s build/actor/actors/steve/geo.inc.c
          test -s build/actor/actors/steve/model.inc.c
          test -s build/actor/actors/steve/geo_header.h
          grep -Eq 'GEO_SCALE\\(LAYER_FORCE, (65536|61440)\\)' build/actor/actors/steve/geo.inc.c
          grep -q 'G_IM_FMT_RGBA' build/actor/actors/steve/model.inc.c
          grep -q 'G_TF_POINT' build/actor/actors/steve/model.inc.c
          grep -q 'gsDPSetTextureImage' build/actor/actors/steve/model.inc.c
          if grep -R "CUSTOM_CMD" build/actor/actors/steve/geo.inc.c; then
            echo "Unsupported CUSTOM_CMD remains in generated GeoLayout"
            exit 1
          fi
          if grep -R "geo_mirror_mario_set_alpha" build/actor/actors/steve/geo.inc.c; then
            echo "Detached Steve must not inherit MarioBodyState alpha"
            exit 1
          fi

      - name: Generate classic Minecraft Steve first-person arm
        run: |
          python tools/build_steve_hand.py \
            --skin assets/steve/steve_skin.png \
            --output build/actor/actors/steve_hand
          test -s build/actor/actors/steve_hand/geo.inc.c
          test -s build/actor/actors/steve_hand/model.inc.c
          test -s build/actor/actors/steve_hand/geo_header.h
          test -s build/actor/actors/steve_hand/arm_front.png
          if grep -n '"actors/steve_hand/' build/actor/actors/steve_hand/model.inc.c; then
            echo "Texture paths must be relative to the actors directory"
            exit 1
          fi
          grep -q '"steve_hand/arm_back.png"' build/actor/actors/steve_hand/model.inc.c
          grep -q 'gsDPSetTextureFilter(G_TF_POINT)' build/actor/actors/steve_hand/model.inc.c
          grep -q 'GEO_SCALE(LAYER_FORCE, 163840)' build/actor/actors/steve_hand/geo.inc.c

      - name: Copy generated actor source into the mod
        run: |
          mkdir -p actors
          rm -rf actors/steve actors/steve_hand
          cp -a build/actor/actors/steve actors/steve
          cp -a build/actor/actors/steve_hand actors/steve_hand

      - name: Upload generated actor and build report
        uses: actions/upload-artifact@v4
        with:
          name: stevecraft-dynos-actor
          path: |
            build/actor/actors/steve/
            build/actor/actors/steve_hand/
            build/steve-build-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated actor sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actors/steve actors/steve_hand
          if git diff --cached --quiet; then
            echo "Generated actor is unchanged."
          else
            git commit -m "Add generated Steve DynOS player model"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
