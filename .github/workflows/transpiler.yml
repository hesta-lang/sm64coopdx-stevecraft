name: SteveCraft Java-to-Lua transpiler
on:
  push:
    branches: [stevecraft-java-lua-transpiler-alpha]
    paths:
      - "tools/java_to_lua.py"
      - "tools/mc_sources_fixture/**"
      - "tools/minecraft_26_3_fixtures/**"
      - "tools/minecraft_26_3_fixture_tree/**"
      - "tools/mc_transpiler_test.py"
      - "tools/minecraft_26_3_target_test.py"
      - "tools/minecraft_26_3_source_test.py"
      - "tools/minecraft_26_3_equivalence_test.py"
      - "tools/minecraft_26_3_model_reference.py"
      - "tools/minecraft_26_3_model_reference_test.py"
      - "tools/extract_minecraft_26_3.py"
      - "tools/Minecraft263Reference.java"
      - "tools/Minecraft263RealSourceRunner.java"
      - "tools/minecraft_26_3_targets.json"
      - "tools/verify_transpiled.lua"
      - "mc_compat.lua"
      - "TRANSPILER.md"
      - ".github/workflows/transpiler.yml"
  pull_request:
    paths:
      - "tools/java_to_lua.py"
      - "tools/mc_sources_fixture/**"
      - "tools/minecraft_26_3_fixtures/**"
      - "tools/minecraft_26_3_fixture_tree/**"
      - "tools/mc_transpiler_test.py"
      - "tools/minecraft_26_3_target_test.py"
      - "tools/minecraft_26_3_source_test.py"
      - "tools/minecraft_26_3_equivalence_test.py"
      - "tools/minecraft_26_3_model_reference.py"
      - "tools/minecraft_26_3_model_reference_test.py"
      - "tools/extract_minecraft_26_3.py"
      - "tools/Minecraft263Reference.java"
      - "tools/minecraft_26_3_targets.json"
      - "tools/verify_transpiled.lua"
      - "mc_compat.lua"
      - "TRANSPILER.md"
      - ".github/workflows/transpiler.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transpiler:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install Lua 5.4 and Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 maven
      - name: Check Python syntax
        run: |
          python -m py_compile tools/java_to_lua.py tools/extract_minecraft_26_3.py \
            tools/mc_transpiler_test.py tools/minecraft_26_3_target_test.py \
            tools/minecraft_26_3_source_test.py tools/minecraft_26_3_equivalence_test.py \
            tools/minecraft_26_3_model_reference.py tools/minecraft_26_3_model_reference_test.py
      - name: Run Python, source extraction, and Java equivalence tests
        run: python -m unittest discover -s tools -p "*_test.py" -v
      - name: Translate existing Java subset fixtures
        run: |
          python tools/java_to_lua.py --input tools/mc_sources_fixture --output build/transpiled --version fixture-validation
          python - <<'PY'
          import json
          r=json.load(open("build/transpiled/transpile-report.json",encoding="utf-8"))
          assert r["translated_methods"]==5 and len(r["skipped_methods"])==1 and r["strict_blockers"]==1 and not r["skipped_files"],r
          PY
      - name: Resolve pinned NeoForm Runtime dependencies
        run: |
          mkdir -p build
          cat > build/nfrt-pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>local.stevecraft</groupId><artifactId>nfrt-runner</artifactId><version>1.0</version>
            <repositories>
              <repository><id>neoforged</id><url>https://maven.neoforged.net/releases/</url></repository>
              <repository><id>fabric</id><url>https://maven.fabricmc.net/</url></repository>
              <repository><id>forge</id><url>https://maven.minecraftforge.net/</url></repository>
            </repositories>
            <dependencies>
              <dependency><groupId>net.neoforged</groupId><artifactId>neoform-runtime</artifactId><version>2.0.31</version></dependency>
            </dependencies>
          </project>
          POM
      - name: Build exact InstallerTools 4.0.17 fatjar for NeoForm
        run: |
          mkdir -p build/installertools
          cat > build/installertools/pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>local.stevecraft</groupId>
            <artifactId>installertools-fatjar-builder</artifactId>
            <version>1.0</version>
            <repositories>
              <repository><id>neoforged</id><url>https://maven.neoforged.net/releases/</url></repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>net.neoforged.installertools</groupId>
                <artifactId>installertools</artifactId>
                <version>4.0.17</version>
              </dependency>
            </dependencies>
            <build>
              <finalName>installertools-4.0.17-fatjar</finalName>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-shade-plugin</artifactId>
                  <version>3.6.0</version>
                  <executions>
                    <execution>
                      <phase>package</phase>
                      <goals><goal>shade</goal></goals>
                      <configuration>
                        <createDependencyReducedPom>false</createDependencyReducedPom>
                        <filters>
                          <filter>
                            <artifact>*:*</artifact>
                            <excludes>
                              <exclude>META-INF/*.SF</exclude>
                              <exclude>META-INF/*.DSA</exclude>
                              <exclude>META-INF/*.RSA</exclude>
                            </excludes>
                          </filter>
                        </filters>
                        <transformers>
                          <transformer implementation="org.apache.maven.plugins.shade.resource.ServicesResourceTransformer"/>
                          <transformer implementation="org.apache.maven.plugins.shade.resource.ManifestResourceTransformer">
                            <mainClass>net.neoforged.installertools.ConsoleTool</mainClass>
                          </transformer>
                        </transformers>
                      </configuration>
                    </execution>
                  </executions>
                </plugin>
              </plugins>
            </build>
          </project>
          POM
          mvn -B -f build/installertools/pom.xml package
          python - <<'PY'
          from pathlib import Path
          jar = Path("build/installertools/target/installertools-4.0.17-fatjar.jar").resolve()
          assert jar.is_file() and jar.stat().st_size > 100_000, jar
          key = r"net.neoforged.installertools\:installertools\:4.0.17\:fatjar"
          Path("build/nfrt-artifact-manifest.properties").write_text(
              f"{key}={jar}\n", encoding="iso-8859-1"
          )
          print("Prepared exact InstallerTools 4.0.17 fatjar:", jar)
          PY
      - name: Generate Mojang-mapped Minecraft 26.3 sources
        run: |
          mvn -B -f build/nfrt-pom.xml org.codehaus.mojo:exec-maven-plugin:3.5.0:java \
            -Dexec.mainClass=net.neoforged.neoform.runtime.cli.Main \
            -Dexec.args="run --neoform=net.neoforged:neoform:26.3-1@zip --dist=joined --artifact-manifest=build/nfrt-artifact-manifest.properties --write-result=gameSources:$GITHUB_WORKSPACE/build/minecraft-26.3-sources.jar --home-dir=$GITHUB_WORKSPACE/build/nfrt-home --work-dir=$GITHUB_WORKSPACE/build/nfrt-work --no-color --verbose"
          test -s build/minecraft-26.3-sources.jar
      - name: Analyze real classes and extract selected source methods
        run: |
          python tools/extract_minecraft_26_3.py --sources build/minecraft-26.3-sources.jar \
            --output build/minecraft-26.3-extracted --report build/minecraft-26.3-source-report.json
          python tools/minecraft_26_3_model_reference.py --input build/minecraft-26.3-extracted \
            --output build/Minecraft263ModelReferenceRunner.java
      - name: Transpile selected Minecraft 26.3 source methods
        run: |
          python tools/java_to_lua.py --input build/minecraft-26.3-extracted --output build/transpiled-real \
            --version 26.3 --class net.minecraft.client.model.HumanoidModel \
            --class net.minecraft.client.model.player.PlayerModel \
            --class net.minecraft.util.Mth \
            --report build/transpiled-real/transpile-report.json
          python - <<'PY'
          import json
          r=json.load(open("build/transpiled-real/transpile-report.json",encoding="utf-8"))
          assert r["translated_methods"]==17 and len(r["skipped_methods"])==7 and r["strict_blockers"]==7 and not r["skipped_files"] and set(r["generated_modules"])=={"net/minecraft/client/model/HumanoidModel.lua","net/minecraft/client/model/player/PlayerModel.lua","net/minecraft/util/Mth.lua"},r
          expected_mth={"clamp","clampedLerp","absMax","equal","sign","lerp","square","frac","inverseLerp","clampedMap","map","lengthSquared","length"}
          actual_mth={x["method"] for x in r["translated_method_details"] if x["class"]=="net.minecraft.util.Mth"}
          assert actual_mth==expected_mth,(actual_mth,expected_mth,r)
          reasons=" | ".join(x["reason"] for x in r["skipped_methods"])
          for x in ("super calls","ternary conditional operator","object construction","lambda/method reference","unadapted Minecraft engine type/API","primitive casts"): assert x in reasons,r
          atan2_skip=[x for x in r["skipped_methods"] if x["class"]=="Mth" and x["method"]=="atan2"]
          assert len(atan2_skip)==1 and "primitive casts" in atan2_skip[0]["reason"],r
          print("Translated real Minecraft methods:",r["translated_methods"],"including 13 emitted Mth double helpers; skipped conservatively:",len(r["skipped_methods"]))
          PY
      - name: Compile extracted Mth source as Java reference
        run: |
          mkdir -p build/java-real-source
          javac -d build/java-real-source build/minecraft-26.3-extracted/net/minecraft/util/Mth.java tools/Minecraft263RealSourceRunner.java
          java -cp build/java-real-source Minecraft263RealSourceRunner > build/java-real-source-reference.txt
          cat build/java-real-source-reference.txt
      - name: Compile extracted HumanoidModel and PlayerModel methods as Java reference
        run: |
          mkdir -p build/java-model-reference
          javac -d build/java-model-reference build/Minecraft263ModelReferenceRunner.java
          java -cp build/java-model-reference Minecraft263ModelReferenceRunner > build/java-model-reference.txt
          cat build/java-model-reference.txt
      - name: Validate generated Lua 5.4 syntax
        run: |
          luac5.4 -p mc_compat.lua
          find build/transpiled build/transpiled-real -name "*.lua" -print0 | xargs -0 -r luac5.4 -p
      - name: Execute Java-to-Lua and Mth/Util equivalence assertions
        run: lua5.4 tools/verify_transpiled.lua
      - name: Upload excerpts, generated Lua, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stevecraft-minecraft-26-3-transpiler-alpha
          if-no-files-found: warn
          path: |
            build/transpiled/
            build/transpiled-real/
            build/minecraft-26.3-source-report.json
            build/minecraft-26.3-extracted/
            build/java-reference.txt
            build/java-real-source-reference.txt
            build/java-model-reference.txt
            build/Minecraft263ModelReferenceRunner.java
            tools/Minecraft263RealSourceRunner.java
            mc_compat.lua
            tools/minecraft_26_3_targets.json
            build/nfrt-artifact-manifest.properties
            build/installertools/target/installertools-4.0.17-fatjar.jar
